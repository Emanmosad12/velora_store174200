<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VÉLORA | المتجر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #F8F7F4; 
      --surface: #FFFFFF; 
      --fg: #111111; 
      --muted: #777777; 
      --accent: #C5A059; 
      --border: #EAEAEA;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--fg); font-family: 'Tajawal', sans-serif; }
    .wrap { max-width: 1300px; margin: 0 auto; padding: 0 30px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; border-bottom: 1px solid var(--border); margin-bottom: 50px; }
    .brand { font-family: 'Cormorant Garamond', serif; font-size: 3rem; letter-spacing: 4px; color: var(--fg); text-decoration: none; font-weight: 600; line-height: 1;}
    
    .cart-btn { background: transparent; color: var(--fg); border: 1px solid var(--fg); padding: 12px 30px; border-radius: 0; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 10px; transition: 0.4s; font-size: 15px;}
    .cart-btn:hover { background: var(--fg); color: #fff; }
    .cart-count { background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;}

    .categories { display: flex; justify-content: center; gap: 40px; margin-bottom: 60px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 25px;}
    .cat-btn { padding: 5px 0; border: none; background: transparent; cursor: pointer; font-family: 'Tajawal'; font-size: 17px; transition: 0.3s; color: var(--muted); position: relative; font-weight: 500;}
    .cat-btn::after { content: ''; position: absolute; bottom: -26px; left: 0; width: 100%; height: 2px; background: var(--fg); transform: scaleX(0); transition: 0.3s; }
    .cat-btn.active { color: var(--fg); }
    .cat-btn.active::after { transform: scaleX(1); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; padding-bottom: 80px;}
    .card { background: transparent; display: flex; flex-direction: column; }
    
    .card-img { height: 350px; background: var(--surface); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; border: 1px solid var(--border);}
    .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
    .card:hover .card-img img { transform: scale(1.08); }
    
    .card-body { padding: 20px 0; text-align: center; display: flex; flex-direction: column; flex-grow: 1;}
    .cat { color: var(--muted); font-size: 13px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
    .title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px; margin: 5px 0; color: var(--fg);}
    .price { color: var(--accent); font-weight: 500; font-size: 18px; margin-top: auto; margin-bottom: 15px;}
    
    .add-btn { background: #fff; color: var(--fg); border: 1px solid var(--fg); padding: 14px; border-radius: 0; cursor: pointer; font-weight: 500; font-size: 15px; transition: 0.4s; width: 100%; text-transform: uppercase; letter-spacing: 1px;}
    .add-btn:hover { background: var(--fg); color: #fff; }
    
    .empty { text-align: center; grid-column: 1/-1; color: var(--muted); margin-top: 50px; font-size: 18px; font-family: 'Cormorant Garamond', serif;}

    .image-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.4s; }
    .image-modal.open { display: flex; opacity: 1; }
    .image-modal img { max-width: 85%; max-height: 85%; object-fit: contain; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
    .image-modal .close-modal { position: absolute; top: 30px; right: 40px; color: var(--fg); font-size: 40px; cursor: pointer; border: none; background: none; font-weight: 300;}

    .cart-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 999; display: none; opacity: 0; transition: 0.4s; backdrop-filter: blur(3px); }
    .cart-overlay.open { display: block; opacity: 1; }
    
    .cart-sidebar { position: fixed; top: 0; left: -450px; width: 100%; max-width: 420px; height: 100%; background: var(--surface); z-index: 1000; transition: 0.4s cubic-bezier(0.77, 0, 0.175, 1); display: flex; flex-direction: column; box-shadow: 5px 0 30px rgba(0,0,0,0.05); }
    .cart-sidebar.open { left: 0; }
    
    .cart-header { padding: 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .cart-header h3 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 600;}
    .close-cart { background: none; border: none; font-size: 30px; cursor: pointer; color: var(--muted); line-height: 1; transition: 0.3s;}
    .close-cart:hover { color: var(--fg); }
    
    .cart-items { flex-grow: 1; overflow-y: auto; padding: 30px; }
    .cart-item { display: flex; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 25px; align-items: center;}
    .cart-item-img { width: 80px; height: 100px; border-radius: 0; background: #f9f9f9; object-fit: cover; }
    .cart-item-info { flex-grow: 1; }
    .cart-item-info h4 { margin: 0 0 5px 0; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;}
    .cart-item-info p { margin: 0; color: var(--accent); font-weight: bold; font-size: 16px;}
    .qty-controls { display: flex; align-items: center; gap: 15px; margin-top: 10px;}
    .qty-controls button { width: 30px; height: 30px; border-radius: 0; border: 1px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.3s;}
    .qty-controls button:hover { border-color: var(--fg); }
    
    .cart-footer { padding: 30px; border-top: 1px solid var(--border); background: #FAFAFA; }
    .total-row { display: flex; justify-content: space-between; font-size: 22px; font-weight: bold; margin-bottom: 25px; font-family: 'Cormorant Garamond', serif;}
    .checkout-btn { display: block; width: 100%; padding: 18px; background: #111; color: #fff; text-align: center; text-decoration: none; border-radius: 0; font-weight: 500; font-size: 16px; border: none; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px;}
    .checkout-btn:hover { background: var(--accent); }
    .empty-cart-msg { text-align: center; color: var(--muted); margin-top: 40px; font-size: 16px; font-family: 'Cormorant Garamond', serif;}
  </style>
</head>
<body>

  <div class="wrap">
    <header>
      <a href="index.html" class="brand">VÉLORA</a>
      <div class="header-actions">
        <button class="cart-btn" onclick="toggleCart()">
          السلة <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <div class="categories" id="categories">
      <button class="cat-btn active" onclick="filter('الكل', this)">الكل</button>
    </div>
    
    <div class="grid" id="grid"><p class="empty">جاري تحميل المنتجات...</p></div>
  </div>

  <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <button class="close-modal" onclick="closeImageModal()">&times;</button>
    <img id="modalImg" src="" alt="صورة المنتج">
  </div>

  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>سلة المشتريات</h3>
      <button class="close-cart" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cartItemsContainer"></div>
    <div class="cart-footer">
      <div class="total-row">
        <span>الإجمالي:</span>
        <span id="cartTotal">0 ج.م</span>
      </div>
      <button class="checkout-btn" onclick="checkoutWhatsApp()">إتمام الطلب عبر واتساب</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKFuZ9WHrS7YP0gRAaGtEjE6C8ZifAjZM",
      authDomain: "velora-e8346.firebaseapp.com",
      projectId: "velora-e8346",
      storageBucket: "velora-e8346.firebasestorage.app",
      messagingSenderId: "795531430750",
      appId: "1:795531430750:web:284bf9e087a9efec879dcf",
      measurementId: "G-0XRFK0LKJK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    const WHATSAPP_NUMBER = "201007301622"; 
    let products = [];
    let cart = JSON.parse(localStorage.getItem("velora_cart")) || [];
    
    const grid = document.getElementById("grid");
    const catContainer = document.getElementById("categories");

    async function fetchProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      products = [];
      querySnapshot.forEach((doc) => { products.push({ id: doc.id, ...doc.data() }); });
      renderCategories();
      renderProducts();
      updateCartUI();
    }

    function renderCategories() {
      const baseCategories = ["الكل", "خواتم", "سلاسل", "حلقان", "أساور", "ساعات"];
      const allCats = [...baseCategories];
      products.forEach(p => { if(p.category && !allCats.includes(p.category)) allCats.push(p.category); });

      catContainer.innerHTML = allCats.map((c, index) => 
        `<button class="cat-btn ${index === 0 ? 'active' : ''}" onclick="filter('${c}', this)">${c}</button>`
      ).join("");
    }

    window.renderProducts = function(filterCat = "الكل") {
      const filtered = filterCat === "الكل" ? products : products.filter(p => p.category === filterCat);
      
      if(filtered.length === 0) {
        grid.innerHTML = "<p class='empty'>لا توجد منتجات في هذا القسم حالياً.</p>";
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="card">
          <div class="card-img" onclick="openImageModal('${p.image}')">
            ${p.image ? `<img src="${p.image}">` : `<span style="font-size: 40px; color: #ccc; font-family: 'Cormorant Garamond';">V</span>`}
          </div>
          <div class="card-body">
            <div class="cat">${p.category || 'بدون تصنيف'}</div>
            <div class="title">${p.name}</div>
            <div class="price">${p.price} ج.م</div>
            <button class="add-btn" onclick="addToCart('${p.id}')">أضيفي للسلة</button>
          </div>
        </div>
      `).join("");
    }

    window.filter = function(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    }

    window.openImageModal = function(imgSrc) {
      if(!imgSrc) return;
      document.getElementById("modalImg").src = imgSrc;
      document.getElementById("imageModal").classList.add("open");
    }
    window.closeImageModal = function() {
      document.getElementById("imageModal").classList.remove("open");
    }

    window.addToCart = function(id) {
      const product = products.find(p => p.id === id);
      if(!product) return;
      const existingItem = cart.find(item => item.id === id);
      if(existingItem) { existingItem.qty += 1; } else { cart.push({ ...product, qty: 1 }); }
      saveCart(); updateCartUI();
      if(!document.getElementById("cartSidebar").classList.contains('open')) { toggleCart(); }
    }

    window.changeQty = function(id, change) {
      const item = cart.find(i => i.id === id);
      if(!item) return;
      item.qty += change;
      if(item.qty <= 0) { cart = cart.filter(i => i.id !== id); }
      saveCart(); updateCartUI();
    }

    function saveCart() { localStorage.setItem("velora_cart", JSON.stringify(cart)); }

    function updateCartUI() {
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCount").innerText = totalItems;

      const container = document.getElementById("cartItemsContainer");
      if(cart.length === 0) {
        container.innerHTML = `<p class="empty-cart-msg">السلة فاضية، ضيفي حاجات تعجبك!</p>`;
        document.getElementById("cartTotal").innerText = "0 ج.م";
        return;
      }

      let totalPrice = 0;
      container.innerHTML = cart.map(item => {
        totalPrice += (item.price * item.qty);
        return `
          <div class="cart-item">
            ${item.image ? `<img src="${item.image}" class="cart-item-img">` : `<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center; background:#f0f0f0;">V</div>`}
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>${item.price} ج.م</p>
              <div class="qty-controls">
                <button onclick="changeQty('${item.id}', -1)">-</button>
                <span>${item.qty}</span>
                <button onclick="changeQty('${item.id}', 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
      document.getElementById("cartTotal").innerText = totalPrice + " ج.م";
    }

    window.toggleCart = function() {
      document.getElementById("cartSidebar").classList.toggle("open");
      document.getElementById("cartOverlay").classList.toggle("open");
    }

    window.checkoutWhatsApp = function() {
      if(cart.length === 0) return alert("السلة فاضية!");
      let msg = "مرحباً VÉLORA، أود طلب المنتجات التالية:\n\n";
      let total = 0;
      
      cart.forEach((item, index) => {
        total += (item.price * item.qty);
        msg += `${index + 1}) ${item.name} - الكمية: ${item.qty} - السعر: ${item.price * item.qty} ج.م\n`;
        if (item.image) { msg += `صورة المنتج: ${item.image}\n`; }
        msg += `\n`;
      });
      
      msg += `الإجمالي الكلي: ${total} ج.م`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    fetchProducts();
  </script>
</body>
</html>
