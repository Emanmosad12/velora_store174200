<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VÉLORA | المتجر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050505; --surface: #111111; --fg: #E5C07B; --muted: #888888; --border: #222222; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: #fff; font-family: 'Tajawal', sans-serif; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; border-bottom: 1px solid var(--border); }
    .brand { font-family: 'Cinzel', serif; font-size: 2.5rem; letter-spacing: 8px; color: var(--fg); text-decoration: none; font-weight: 600;}
    
    .cart-btn { background: transparent; color: var(--fg); border: 1px solid var(--fg); padding: 10px 25px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 10px; transition: 0.4s; font-size: 1rem; font-family: 'Tajawal', sans-serif;}
    .cart-btn:hover { background: var(--fg); color: #000; }
    .cart-count { background: #000; color: var(--fg); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;}

    /* شريط البحث */
    .search-container { display: flex; justify-content: center; margin-top: 30px; padding: 0 20px;}
    .search-input { width: 100%; max-width: 400px; padding: 15px 20px; background: transparent; border: 1px solid var(--border); border-radius: 30px; color: #fff; font-family: 'Tajawal', sans-serif; font-size: 1rem; outline: none; transition: 0.3s;}
    .search-input:focus { border-color: var(--fg); box-shadow: 0 0 15px rgba(229, 192, 123, 0.1);}

    .categories { display: flex; justify-content: center; gap: 50px; margin: 30px 0 50px 0; flex-wrap: wrap; }
    .cat-btn { padding: 5px 0; border: none; background: transparent; cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 1.1rem; transition: 0.3s; color: var(--muted); position: relative; font-weight: 400;}
    .cat-btn::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background: var(--fg); transform: scaleX(0); transition: 0.3s; }
    .cat-btn.active { color: var(--fg); font-weight: 700;}
    .cat-btn.active::after { transform: scaleX(1); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; padding: 0 60px 100px 60px;}
    .card { background: var(--surface); display: flex; flex-direction: column; border: 1px solid var(--border); transition: 0.4s; position: relative; overflow: hidden;}
    .card:hover { border-color: var(--fg); box-shadow: 0 10px 40px rgba(229, 192, 123, 0.1); }
    
    .card-img { height: 400px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative;}
    .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s ease; filter: brightness(0.8) contrast(1.1);}
    .card:hover .card-img img { transform: scale(1.05); filter: brightness(1); }
    
    .card-body { padding: 30px; text-align: center; display: flex; flex-direction: column; flex-grow: 1;}
    .cat { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase;}
    .title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 2rem; margin: 5px 0; color: #fff;}
    .prod-id { font-size: 0.9rem; color: var(--fg); margin-bottom: 10px; letter-spacing: 1px;}
    .price { color: var(--fg); font-weight: 400; font-size: 1.5rem; margin-top: auto; margin-bottom: 20px; font-family: 'Cormorant Garamond', serif;}
    
    .add-btn { background: transparent; color: var(--fg); border: 1px solid var(--fg); padding: 15px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.4s; width: 100%; font-family: 'Tajawal', sans-serif; letter-spacing: 2px;}
    .add-btn:hover { background: var(--fg); color: #000; box-shadow: 0 0 20px rgba(229, 192, 123, 0.4); }
    
    .empty { text-align: center; grid-column: 1/-1; color: var(--muted); margin-top: 50px; font-size: 1.5rem; font-family: 'Cormorant Garamond', serif;}

    /* باقي الأكواد زي ما هي (المودال، السلة، إلخ) */
    .image-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.4s; backdrop-filter: blur(10px);}
    .image-modal.open { display: flex; opacity: 1; }
    .image-modal img { max-width: 90%; max-height: 90%; object-fit: contain; box-shadow: 0 0 50px rgba(229, 192, 123, 0.2); }
    .image-modal .close-modal { position: absolute; top: 30px; right: 40px; color: var(--fg); font-size: 40px; cursor: pointer; border: none; background: none; font-weight: 300;}

    .cart-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 999; display: none; opacity: 0; transition: 0.4s; backdrop-filter: blur(5px); }
    .cart-overlay.open { display: block; opacity: 1; }
    
    .cart-sidebar { position: fixed; top: 0; left: -450px; width: 100%; max-width: 450px; height: 100%; background: #0A0A0A; z-index: 1000; transition: 0.4s cubic-bezier(0.77, 0, 0.175, 1); display: flex; flex-direction: column; border-right: 1px solid var(--border);}
    .cart-sidebar.open { left: 0; }
    
    .cart-header { padding: 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .cart-header h3 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 600; color: #fff;}
    .close-cart { background: none; border: none; font-size: 30px; cursor: pointer; color: var(--muted); line-height: 1; transition: 0.3s;}
    .close-cart:hover { color: #fff; }
    
    .cart-items { flex-grow: 1; overflow-y: auto; padding: 40px; }
    .cart-item { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 30px; align-items: center;}
    .cart-item-img { width: 80px; height: 100px; background: #111; object-fit: cover; border: 1px solid var(--border);}
    .cart-item-info { flex-grow: 1; }
    .cart-item-info h4 { margin: 0 0 5px 0; font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; color: #fff;}
    .cart-item-info p { margin: 0; color: var(--fg); font-weight: bold; font-size: 1.2rem; font-family: 'Cormorant Garamond', serif;}
    .qty-controls { display: flex; align-items: center; gap: 15px; margin-top: 15px;}
    .qty-controls button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.3s;}
    .qty-controls button:hover { border-color: var(--fg); color: var(--fg); }
    
    .cart-footer { padding: 40px; border-top: 1px solid var(--border); background: #050505; }
    .total-row { display: flex; justify-content: space-between; font-size: 1.8rem; font-weight: bold; margin-bottom: 30px; font-family: 'Cormorant Garamond', serif; color: #fff;}
    .checkout-btn { display: block; width: 100%; padding: 20px; background: var(--fg); color: #000; text-align: center; text-decoration: none; font-weight: 700; font-size: 1.1rem; border: none; cursor: pointer; transition: 0.4s; font-family: 'Tajawal', sans-serif; letter-spacing: 2px;}
    .checkout-btn:hover { background: transparent; border: 1px solid var(--fg); color: var(--fg); }
    .empty-cart-msg { text-align: center; color: var(--muted); margin-top: 40px; font-size: 1.2rem; font-family: 'Cormorant Garamond', serif;}

    @media (max-width: 768px) {
      header { padding: 20px; }
      .brand { font-size: 1.8rem; letter-spacing: 4px; }
      .categories { gap: 20px; margin: 20px 0 30px 0; }
      .grid { padding: 0 20px 50px 20px; gap: 30px; }
      .card-img { height: 300px; }
      .title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">VÉLORA</a>
    <button class="cart-btn" onclick="toggleCart()">
      السلة <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <!-- خانة البحث -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="ابحثي باسم المنتج أو الكود..." oninput="searchProducts()">
  </div>

  <div class="categories" id="categories">
    <button class="cat-btn active" onclick="filter('الكل', this)">الكل</button>
  </div>
  
  <div class="grid" id="grid"><p class="empty">جاري تحميل المنتجات...</p></div>

  <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <button class="close-modal" onclick="closeImageModal()">&times;</button>
    <img id="modalImg" src="" alt="صورة المنتج">
  </div>

  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>السلة</h3>
      <button class="close-cart" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cartItemsContainer"></div>
    <div class="cart-footer">
      <div class="total-row">
        <span>الإجمالي:</span>
        <span id="cartTotal">0 ج.م</span>
      </div>
      <button class="checkout-btn" onclick="checkoutWhatsApp()">إتمام الطلب عبر واتساب</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKFuZ9WHrS7YP0gRAaGtEjE6C8ZifAjZM",
      authDomain: "velora-e8346.firebaseapp.com",
      projectId: "velora-e8346",
      storageBucket: "velora-e8346.firebasestorage.app",
      messagingSenderId: "795531430750",
      appId: "1:795531430750:web:284bf9e087a9efec879dcf",
      measurementId: "G-0XRFK0LKJK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    const WHATSAPP_NUMBER = "201007301622"; 
    let allProducts = []; // كل المنتجات
    let displayedProducts = []; // المنتجات اللي بتظهر
    let currentCategory = "الكل";
    let cart = JSON.parse(localStorage.getItem("velora_cart")) || [];
    
    const grid = document.getElementById("grid");
    const catContainer = document.getElementById("categories");

    async function fetchProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      allProducts = [];
      querySnapshot.forEach((doc) => { allProducts.push({ id: doc.id, ...doc.data() }); });
      
      renderCategories();
      filter(currentCategory, catContainer.firstElementChild); // عرض كل المنتجات في البداية
      updateCartUI();
    }

    function renderCategories() {
      const baseCategories = ["الكل", "خواتم", "سلاسل", "حلقان", "أساور", "ساعات"];
      const allCats = [...baseCategories];
      allProducts.forEach(p => { if(p.category && !allCats.includes(p.category)) allCats.push(p.category); });

      catContainer.innerHTML = allCats.map((c, index) => 
        `<button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="filter('${c}', this)">${c}</button>`
      ).join("");
    }

    window.filter = function(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      
      // بنفلتر بالتصنيف الأول
      let filtered = cat === "الكل" ? allProducts : allProducts.filter(p => p.category === cat);
      
      // بعدين بنشوف لو فيه كلمة في البحث
      const searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
      if (searchTerm) {
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(searchTerm) || 
          (p.productId && p.productId.toLowerCase().includes(searchTerm))
        );
      }

      displayedProducts = filtered;
      renderProducts();
    }

    window.searchProducts = function() {
      // لما نكتب في البحث، بنعيد الفلترة بالتصنيف الحالي والبحث
      filter(currentCategory, document.querySelector('.cat-btn.active'));
    }

    window.renderProducts = function() {
      if(displayedProducts.length === 0) {
        grid.innerHTML = "<p class='empty'>لا توجد منتجات تطابق بحثك.</p>";
        return;
      }

      grid.innerHTML = displayedProducts.map(p => `
        <div class="card">
          <div class="card-img" onclick="openImageModal('${p.image}')">
            ${p.image ? `<img src="${p.image}">` : `<span style="font-size: 40px; color: #333; font-family: 'Cinzel';">V</span>`}
          </div>
          <div class="card-body">
            <div class="cat">${p.category || 'بدون تصنيف'}</div>
            <div class="title">${p.name}</div>
            ${p.productId ? `<div class="prod-id">كود: ${p.productId}</div>` : ''}
            <div class="price">${p.price} ج.م</div>
            <button class="add-btn" onclick="addToCart('${p.id}')">أضيفي للسلة</button>
          </div>
        </div>
      `).join("");
    }

    window.openImageModal = function(imgSrc) {
      if(!imgSrc) return;
      document.getElementById("modalImg").src = imgSrc;
      document.getElementById("imageModal").classList.add("open");
    }
    window.closeImageModal = function() {
      document.getElementById("imageModal").classList.remove("open");
    }

    window.addToCart = function(id) {
      const product = allProducts.find(p => p.id === id);
      if(!product) return;
      const existingItem = cart.find(item => item.id === id);
      if(existingItem) { existingItem.qty += 1; } else { cart.push({ ...product, qty: 1 }); }
      saveCart(); updateCartUI();
      if(!document.getElementById("cartSidebar").classList.contains('open')) { toggleCart(); }
    }

    window.changeQty = function(id, change) {
      const item = cart.find(i => i.id === id);
      if(!item) return;
      item.qty += change;
      if(item.qty <= 0) { cart = cart.filter(i => i.id !== id); }
      saveCart(); updateCartUI();
    }

    function saveCart() { localStorage.setItem("velora_cart", JSON.stringify(cart)); }

    function updateCartUI() {
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCount").innerText = totalItems;

      const container = document.getElementById("cartItemsContainer");
      if(cart.length === 0) {
        container.innerHTML = `<p class="empty-cart-msg">السلة فاضية، ضيفي حاجات تعجبك!</p>`;
        document.getElementById("cartTotal").innerText = "0 ج.م";
        return;
      }

      let totalPrice = 0;
      container.innerHTML = cart.map(item => {
        totalPrice += (item.price * item.qty);
        return `
          <div class="cart-item">
            ${item.image ? `<img src="${item.image}" class="cart-item-img">` : `<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center; color:#444;">V</div>`}
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>${item.price} ج.م</p>
              <div class="qty-controls">
                <button onclick="changeQty('${item.id}', -1)">-</button>
                <span>${item.qty}</span>
                <button onclick="changeQty('${item.id}', 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
      document.getElementById("cartTotal").innerText = totalPrice + " ج.م";
    }

    window.toggleCart = function() {
      document.getElementById("cartSidebar").classList.toggle("open");
      document.getElementById("cartOverlay").classList.toggle("open");
    }

    // إرسال الواتساب (بدون صور عشان نمنع الإيرور)
    window.checkoutWhatsApp = function() {
      if(cart.length === 0) return alert("السلة فاضية!");
      
      let msg = "مرحباً VÉLORA، أود طلب المنتجات التالية:\n\n";
      let total = 0;
      
      cart.forEach((item, index) => {
        total += (item.price * item.qty);
        msg += `${index + 1}) ${item.name}`;
        if(item.productId) msg += ` (كود: ${item.productId})`;
        msg += ` - الكمية: ${item.qty} - السعر: ${item.price * item.qty} ج.م\n\n`;
      });
      
      msg += `الإجمالي الكلي: ${total} ج.م`;
      
      const encodedMsg = encodeURIComponent(msg);
      window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMsg}`;
    }

    fetchProducts();
  </script>
</body>
</html>
