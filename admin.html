<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة - VÉLORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F8F7F4; --surface: #FFF; --fg: #111; --muted: #777; --accent: #C5A059; --border: #EAEAEA;}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--fg); padding: 40px 20px; }
    
    /* شاشة الباسورد */
    #loginScreen { position: fixed; inset: 0; background: #0a0a0a; display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
    #loginScreen h2 { color: var(--accent); font-family: 'Cormorant Garamond', serif; font-size: 3rem; margin-bottom: 30px; letter-spacing: 2px;}
    #loginScreen input { padding: 15px; width: 300px; border: 1px solid #333; background: #1a1a1a; color: #fff; border-radius: 0; text-align: center; font-size: 18px; margin-bottom: 20px; font-family: 'Tajawal'; outline: none;}
    #loginScreen button { padding: 15px 50px; background: var(--accent); color: #000; border: none; border-radius: 0; cursor: pointer; font-weight: bold; font-size: 16px; font-family: 'Tajawal'; transition: 0.3s; letter-spacing: 1px;}
    #loginScreen button:hover { background: #b08d4a; }

    /* لوحة التحكم */
    #adminPanel { display: none; max-width: 800px; margin: 0 auto; }
    .box { background: var(--surface); padding: 50px; border-radius: 0; border: 1px solid var(--border); }
    h2 { font-family: 'Cormorant Garamond', serif; text-align: center; font-size: 2.8rem; margin-bottom: 30px; color: var(--fg); font-weight: 600;}
    
    input, select, button { width: 100%; padding: 16px; margin: 10px 0; box-sizing: border-box; border: 1px solid var(--border); border-radius: 0; font-family: 'Tajawal'; font-size: 16px; background: #FAFAFA; outline: none;}
    input:focus, select:focus { border-color: var(--fg); background: #fff;}
    
    .submit-btn { background: var(--fg); color: #fff; border: none; cursor: pointer; font-weight: 500; font-size: 16px; transition: 0.4s; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px;}
    .submit-btn:hover { background: var(--accent); }
    
    .item { background: #fff; padding: 20px; margin-top: 15px; border-radius: 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);}
    .item img { width: 60px; height: 80px; object-fit: cover; border-radius: 0; margin-left: 20px;}
    .item-info { flex-grow: 1; }
    .item-info b { font-family: 'Cormorant Garamond', serif; font-size: 20px; display: block; margin-bottom: 5px;}
    .item-info span { color: var(--muted); font-size: 14px; }
    .del-btn { background: transparent; color: #d9534f; border: 1px solid #d9534f; width: auto; padding: 8px 20px; margin: 0; font-size: 14px; cursor: pointer; transition: 0.3s;}
    .del-btn:hover { background: #d9534f; color: #fff;}

    .list-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-top: 50px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
  </style>
</head>
<body>

  <div id="loginScreen">
    <h2>VÉLORA ADMIN</h2>
    <input type="password" id="passInput" placeholder="أدخلي كلمة المرور" onkeypress="if(event.key==='Enter') checkPass()">
    <button onclick="checkPass()">دخول</button>
  </div>

  <div id="adminPanel">
    <div class="box">
      <h2>إضافة منتج جديد</h2>
      <select id="category">
        <option value="" disabled selected>اختاري التصنيف...</option>
        <option value="خواتم">خواتم</option>
        <option value="سلاسل">سلاسل</option>
        <option value="حلقان">حلقان</option>
        <option value="أساور">أساور</option>
        <option value="ساعات">ساعات</option>
      </select>
      <input type="text" id="name" placeholder="اسم المنتج">
      <input type="number" id="price" placeholder="السعر (ج.م)">
      <label style="color: var(--muted); font-size: 14px; display:block; margin-top:15px;">صورة المنتج:</label>
      <input type="file" id="imageFile" accept="image/*">
      <button onclick="addProduct()" id="submitBtn" class="submit-btn">حفظ وإضافة المنتج للويب</button>

      <h3 class="list-title">المنتجات الحالية:</h3>
      <div id="productList"><p style="color:var(--muted);">جاري تحميل المنتجات...</p></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKFuZ9WHrS7YP0gRAaGtEjE6C8ZifAjZM",
      authDomain: "velora-e8346.firebaseapp.com",
      projectId: "velora-e8346",
      storageBucket: "velora-e8346.firebasestorage.app",
      messagingSenderId: "795531430750",
      appId: "1:795531430750:web:284bf9e087a9efec879dcf",
      measurementId: "G-0XRFK0LKJK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkPass = function() {
      const pass = document.getElementById("passInput").value;
      if(pass === "em17@Mosad") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadProducts();
      } else {
        alert("كلمة المرور خطأ!");
      }
    }

    async function loadProducts() {
      const listDiv = document.getElementById("productList");
      listDiv.innerHTML = "<p>جاري التحميل...</p>";
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        if (querySnapshot.empty) {
          listDiv.innerHTML = "<p style='color:var(--muted);'>لا توجد منتجات مضافة.</p>";
          return;
        }
        let html = "";
        querySnapshot.forEach((docSnap) => {
          const p = docSnap.data();
          html += `
            <div class="item">
              <div style="display:flex; align-items:center;">
                ${p.image ? `<img src="${p.image}">` : '<div style="width:60px; height:80px; background:#eee; margin-left:20px;"></div>'}
                <div class="item-info">
                  <b>${p.name}</b>
                  <span>${p.price} ج.م | ${p.category}</span>
                </div>
              </div>
              <button class="del-btn" onclick="deleteProduct('${docSnap.id}')">حذف</button>
            </div>
          `;
        });
        listDiv.innerHTML = html;
      } catch (e) { listDiv.innerHTML = "<p style='color:red;'>حدث خطأ في تحميل المنتجات.</p>"; }
    }

    window.addProduct = async function() {
      const name = document.getElementById("name").value;
      const price = document.getElementById("price").value;
      const category = document.getElementById("category").value;
      const fileInput = document.getElementById("imageFile");

      if(!name || !price || !category) return alert("تأكدي من كتابة الاسم، السعر، واختيار التصنيف.");

      const btn = document.getElementById("submitBtn");
      btn.innerText = "جاري الحفظ...";
      btn.disabled = true;

      let imageBase64 = "";
      if (fileInput.files.length > 0) {
        const reader = new FileReader();
        imageBase64 = await new Promise((resolve) => {
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(fileInput.files[0]);
        });
      }

      try {
        await addDoc(collection(db, "products"), {
          name: name, price: Number(price), category: category, image: imageBase64, createdAt: new Date()
        });
        alert("تمت إضافة المنتج بنجاح!");
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("category").value = "";
        document.getElementById("imageFile").value = "";
        loadProducts();
      } catch (error) { alert("حصل خطأ: " + error.message); } 
      finally { btn.innerText = "حفظ وإضافة المنتج للويب"; btn.disabled = false; }
    }

    window.deleteProduct = async function(id) {
      if(!confirm("هل أنتِ متأكدة من حذف هذا المنتج نهائياً؟")) return;
      try {
        await deleteDoc(doc(db, "products", id));
        alert("تم حذف المنتج بنجاح.");
        loadProducts();
      } catch (error) { alert("حصل خطأ أثناء الحذف: " + error.message); }
    }
  </script>
</body>
</html>
