<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة - VÉLORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F9F8F6; --fg: #1A1A1A; --muted: #888; --accent: #C5A059; --border: #EAEAEA;}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Amiri', serif; background: var(--bg); color: var(--fg); padding: 60px 20px; }
    
    #loginScreen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
    #loginScreen h2 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; margin-bottom: 30px; letter-spacing: 5px; color: var(--fg);}
    #loginScreen input { padding: 15px; width: 300px; border: 1px solid var(--border); background: transparent; color: var(--fg); border-radius: 0; text-align: center; font-size: 18px; margin-bottom: 20px; font-family: 'Amiri', serif; outline: none;}
    #loginScreen button { padding: 15px 50px; background: var(--fg); color: #fff; border: none; border-radius: 0; cursor: pointer; font-weight: 700; font-size: 16px; font-family: 'Amiri', serif; transition: 0.3s; letter-spacing: 2px;}
    #loginScreen button:hover { background: var(--accent); }

    #adminPanel { display: none; max-width: 800px; margin: 0 auto; }
    .box { background: transparent; padding: 20px; }
    h2 { font-family: 'Amiri', serif; text-align: center; font-size: 2.8rem; margin-bottom: 40px; color: var(--fg); font-weight: 700;}
    
    input, select, button { width: 100%; padding: 18px; margin: 10px 0; box-sizing: border-box; border: 1px solid var(--border); border-radius: 0; font-family: 'Amiri', serif; font-size: 1.2rem; background: transparent; outline: none;}
    input:focus, select:focus { border-color: var(--fg); }
    
    .submit-btn { background: var(--fg); color: #fff; border: none; cursor: pointer; font-weight: 700; font-size: 1.2rem; transition: 0.4s; margin-top: 20px; letter-spacing: 2px;}
    .submit-btn:hover { background: var(--accent); }
    
    .item { background: transparent; padding: 20px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);}
    .item img { width: 60px; height: 80px; object-fit: cover; margin-left: 20px;}
    .item-info { flex-grow: 1; }
    .item-info b { font-family: 'Amiri', serif; font-size: 1.5rem; display: block; margin-bottom: 5px;}
    .item-info span { color: var(--muted); font-size: 1.2rem; font-family: 'Cormorant Garamond', serif;}
    .del-btn { background: transparent; color: #d9534f; border: 1px solid #d9534f; width: auto; padding: 8px 20px; margin: 0; font-size: 1rem; cursor: pointer; transition: 0.3s; font-family: 'Amiri', serif;}
    .del-btn:hover { background: #d9534f; color: #fff;}

    .list-title { font-family: 'Amiri', serif; font-size: 2.5rem; margin-top: 60px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
  </style>
</head>
<body>

  <div id="loginScreen">
    <h2>VÉLORA</h2>
    <input type="password" id="passInput" placeholder="أدخلي كلمة المرور" onkeypress="if(event.key==='Enter') checkPass()">
    <button onclick="checkPass()">دخول</button>
  </div>

  <div id="adminPanel">
    <div class="box">
      <h2>إضافة منتج جديد</h2>
      <select id="category">
        <option value="" disabled selected>اختاري التصنيف...</option>
        <option value="خواتم">خواتم</option>
        <option value="سلاسل">سلاسل</option>
        <option value="حلقان">حلقان</option>
        <option value="أساور">أساور</option>
        <option value="ساعات">ساعات</option>
      </select>
      <input type="text" id="productId" placeholder="كود المنتج (مثال: P100)">
      <input type="text" id="name" placeholder="اسم المنتج">
      <input type="number" id="price" placeholder="السعر (ج.م)">
      <label style="color: var(--muted); font-size: 1.1rem; display:block; margin-top:15px;">صورة المنتج:</label>
      <input type="file" id="imageFile" accept="image/*">
      <button onclick="addProduct()" id="submitBtn" class="submit-btn">حفظ وإضافة المنتج</button>

      <h3 class="list-title">المنتجات الحالية:</h3>
      <div id="productList"><p style="color:var(--muted);">جاري تحميل المنتجات...</p></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKFuZ9WHrS7YP0gRAaGtEjE6C8ZifAjZM",
      authDomain: "velora-e8346.firebaseapp.com",
      projectId: "velora-e8346",
      storageBucket: "velora-e8346.firebasestorage.app",
      messagingSenderId: "795531430750",
      appId: "1:795531430750:web:284bf9e087a9efec879dcf",
      measurementId: "G-0XRFK0LKJK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const IMGBB_API_KEY = "655d3c48a8cea70f1ce605b88f9fff17";

    window.checkPass = function() {
      const pass = document.getElementById("passInput").value;
      if(pass === "em17@Mosad") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadProducts();
      } else {
        alert("كلمة المرور خطأ!");
      }
    }

    async function loadProducts() {
      const listDiv = document.getElementById("productList");
      listDiv.innerHTML = "<p>جاري التحميل...</p>";
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        if (querySnapshot.empty) {
          listDiv.innerHTML = "<p style='color:var(--muted);'>لا توجد منتجات مضافة.</p>";
          return;
        }
        let html = "";
        querySnapshot.forEach((docSnap) => {
          const p = docSnap.data();
          html += `
            <div class="item">
              <div style="display:flex; align-items:center;">
                ${p.image ? `<img src="${p.image}">` : '<div style="width:60px; height:80px; background:#eee; margin-left:20px;"></div>'}
                <div class="item-info">
                  <b>${p.name} <span style="font-size: 1rem; color: #C5A059;">(كود: ${p.productId || 'بدون كود'})</span></b>
                  <span>${p.price} ج.م | ${p.category}</span>
                </div>
              </div>
              <button class="del-btn" onclick="deleteProduct('${docSnap.id}')">حذف</button>
            </div>
          `;
        });
        listDiv.innerHTML = html;
      } catch (e) { listDiv.innerHTML = "<p style='color:red;'>حدث خطأ في تحميل المنتجات.</p>"; }
    }

    window.addProduct = async function() {
      const productId = document.getElementById("productId").value;
      const name = document.getElementById("name").value;
      const price = document.getElementById("price").value;
      const category = document.getElementById("category").value;
      const fileInput = document.getElementById("imageFile");

      if(!name || !price || !category) return alert("تأكدي من كتابة الاسم، السعر، واختيار التصنيف.");

      const btn = document.getElementById("submitBtn");
      btn.innerText = "جاري رفع الصورة...";
      btn.disabled = true;

      let imageUrl = "";

      try {
        if (fileInput.files.length > 0) {
          const formData = new FormData();
          formData.append("image", fileInput.files[0]);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
          });

          const data = await response.json();
          if(data.success) {
            imageUrl = data.data.url;
          } else {
            throw new Error("فشل رفع الصورة.");
          }
        }

        btn.innerText = "جاري حفظ المنتج...";

        await addDoc(collection(db, "products"), {
          productId: productId, // بنحفظ كود المنتج
          name: name, 
          price: Number(price), 
          category: category, 
          image: imageUrl,
          createdAt: new Date()
        });

        alert("تمت إضافة المنتج بنجاح!");
        document.getElementById("productId").value = "";
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("category").value = "";
        document.getElementById("imageFile").value = "";
        loadProducts();

      } catch (error) { 
        alert("حصل خطأ: " + error.message); 
      } finally { 
        btn.innerText = "حفظ وإضافة المنتج للويب"; 
        btn.disabled = false; 
      }
    }

    window.deleteProduct = async function(id) {
      if(!confirm("هل أنتِ متأكدة من حذف هذا المنتج نهائياً؟")) return;
      try {
        await deleteDoc(doc(db, "products", id));
        alert("تم حذف المنتج بنجاح.");
        loadProducts();
      } catch (error) { alert("حصل خطأ أثناء الحذف: " + error.message); }
    }
  </script>
</body>
</html>
